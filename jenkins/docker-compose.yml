name: jenkins-microservicios

services:
  # Daemon Docker aislado (Docker-in-Docker). Los pipelines hacen build/push
  # contra este daemon, no contra el del host.
  docker:
    image: docker:dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    networks:
      jenkins:
        aliases:
          - docker
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    ports:
      - "2376:2376"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkins-microservicios:local
    restart: unless-stopped
    depends_on:
      docker:
        condition: service_healthy
    environment:
      # Conexion TLS al sidecar dind
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
    env_file:
      - path: .env
        required: false
    networks:
      - jenkins
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    ports:
      # host configurable via JENKINS_HTTP_PORT; el contenedor SIEMPRE expone 8080
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "50000:50000"

volumes:
  jenkins-data:
  jenkins-docker-certs:

networks:
  jenkins:
